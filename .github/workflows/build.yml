name: Build KursRadar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj projekt z ZIP
        run: |
          FOUND=0
          for f in *; do
            if [ -f "$f" ] && unzip -tq "$f" >/dev/null 2>&1; then
              unzip -o "$f"
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" = "0" ]; then
            echo "Nie znaleziono pliku ZIP w repozytorium"
            exit 1
          fi
          ls -R

      - name: Zainstaluj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Zainstaluj Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Dekoduj klucz Release
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Zbuduj podpisany plik APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Udostepnij gotowy plik APK
        uses: actions/upload-artifact@v4
        with:
          name: KursRadar-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
